name: Update Paper Radar

on:
  schedule:
    # 每天 21:30 UTC 运行（= 北京时间早上 5:30）
    # 想改成每两天一次：把下面一行换成  - cron: "30 21 */2 * *"
    - cron: "30 21 * * *"
  workflow_dispatch: {}   # 允许在 Actions 页面手动点按钮触发

permissions:
  contents: write

concurrency:
  group: radar-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch new papers from OpenAlex
        run: python fetch_new.py

      - name: Screen papers with DeepSeek
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python screen_new.py

      - name: Rebuild site data
        run: python build_site.py

      - name: Commit and push updates
        run: |
          git config user.name "paper-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Radar update $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
